# Release: runs when a tag vMAJOR.MINOR.BUILD is pushed (it must equal .version).
# It first runs the continuous integration (ci.yml), then builds every app of
# apps/ for the reader and the installer for Windows, Linux and macOS, and
# publishes one GitHub Release with:
#   - <id>.zip (the <id>.app and its app.json) for every app, and catalog.json that
#     lists them (the Launcher reads these; GitHub refuses release files named *.app)
#   - pbgo-installer_<os>_<arch>.zip|.tar.gz  the installer for people
#   - SHA256SUMS
#   - release notes with the install command for each system (tools/release)
# See docs/en/16-installer.md. The continuous integration is another workflow.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write # the called workflow declares it for its badge step (skipped on tags)

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22" # the tools and the installer; the apps are built by the SDK image (Go 1.17)

      - name: The tag must be the version of the code
        run: |
          version="$(tr -d '\r\n' < .version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match .version ($version)"; exit 1
          fi

      - name: Every app carries its own version
        run: |
          for dir in apps/*/; do
            app="$(basename "$dir")"
            [ -f "apps/$app/main.go" ] || continue
            go run ./tools/bumpversion -app "$app" check
          done

      - name: Build every app for the reader (SDK image)
        run: |
          docker build -t go-pocketbook-base-sdk docker
          mkdir -p dist/applications
          for dir in apps/*/; do
            app="$(basename "$dir")"
            [ -f "apps/$app/main.go" ] || continue
            version="$(head -n1 "apps/$app/.version" | tr -d '\r')"
            docker run --rm -v "$PWD":/app -v pbgo-cache:/gopath go-pocketbook-base-sdk \
              build "-ldflags=-X=go-pocketbook-base/internal/kernel/version.Value=$version" \
              -o "dist/applications/$app.app" "./apps/$app"
          done

      - name: Installers, manifests, checksums and release notes
        run: go run ./tools/release

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(ls release/* | grep -v RELEASE_NOTES.md)
          # a draft first: if an upload fails nothing half-made is public
          gh release create "$GITHUB_REF_NAME" $files --draft \
            --title "$GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
